*{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:#2b160b;color:#fff8e8;display:flex;justify-content:center;overflow-x:hidden}

.logo{width:145px;height:145px;border-radius:50%;object-fit:cover;border:5px solid #e87513;box-shadow:0 12px 35px #0008;margin:8px auto 18px;display:block}

.btn:hover{transform:translateY(-2px);background:#45200d}
.icon{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:25px;background:#fff}
.name{font-size:18px;font-weight:700;text-align:right;flex:1} .sub{display:block;font-size:12px;color:#d8c4a6;font-weight:400;margin-top:4px}
.arrow{font-size:22px;color:#f28a24}
.footer{margin-top:24px;font-size:12px;letter-spacing:3px;color:#cdb89a}
.note{font-size:13px;color:#e8d8c0;margin:0 0 14px}
